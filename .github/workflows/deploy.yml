name: Déploiement automatique Vigie Routière

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Déployer sur le VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /opt/vigie-routiere
            git fetch origin main
            git reset --hard origin/main
            chmod -R g+rX /opt/vigie-routiere
            .venv/bin/python -m pip install --upgrade -r requirements-backend.txt -r requirements-frontend.txt
            sudo systemctl restart vigie-backend
            sudo systemctl restart vigie-frontend
            sleep 2
            curl -fsS http://127.0.0.1:8000/health
